# The smallest Template the `soma.template/v1alpha1` schema accepts.
#
# Five values are mandatory: the schema, the name, the image, the platform, and the program.
# Everything else has a default, so this file states only what it actually chooses. The
# `args` line below is content rather than ceremony; drop it and the program runs bare.
#
# The omitted tables resolve to: 1 vCPU, 1024 MiB of memory and 10240 MiB of writable storage
# from the same `MachineShape` constants `soma run` defaults to; a 300 second idle timeout, a
# 3600 second maximum lifetime, and `destroy` on idle; and denied egress with denied ingress,
# which is the safe answer for a Template that talks to nothing.

schema = "soma.template/v1alpha1"
name = "minimal"
description = "One shell command in a Debian base image with no network."

[workload]
image = "debian:12-slim"
platform = "linux/amd64"

[command]
program = "/bin/sh"
args = ["-c", "echo hello from soma"]
