name: RL workload

on:
  pull_request:
    paths:
      - workloads/rl-frozenlake/**
      - .github/workflows/rl-workload.yml
  push:
    branches: [main]
    paths:
      - workloads/rl-frozenlake/**
      - .github/workflows/rl-workload.yml

permissions:
  contents: read

concurrency:
  group: rl-workload-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/miosa-osa/soma-rl-frozenlake

jobs:
  image:
    name: Build and verify FrozenLake
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Upload the public image archive as a release asset.
      packages: write # Publish the verified OCI image on main pushes.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" workloads/rl-frozenlake

      - name: Verify training without guest network access
        run: |
          for seed in 42 43 44 45; do
            result=$(docker run --rm --network none "$IMAGE:$GITHUB_SHA" --seed "$seed")
            jq -e --argjson seed "$seed" '
              .environment == "FrozenLake-v1" and
              .seed == $seed and .training_episodes == 2000 and .evaluation_episodes == 100 and
              .trained_goal_count == 100 and .random_goal_count < .trained_goal_count and
              (.policy | length) == 16
            ' <<< "$result" >/dev/null
            printf '%s\n' "$result"
          done

      - name: Verify CartPole episode accounting across vector modes
        run: |
          for policy in random balance; do
            for mode in sync async; do
              result=$(docker run --rm --network none --cpus 4 --entrypoint /usr/local/bin/python3 \
                "$IMAGE:$GITHUB_SHA" /opt/soma-rl/rollouts.py --mode "$mode" --policy "$policy")
              jq -e '
                .environment == "CartPole-v1" and .completed_episodes == 100 and
                .episodes_per_worker == [25,25,25,25] and
                (.terminated_episodes + .time_limit_episodes == .completed_episodes) and
                (.simulator_steps >= .recorded_steps and .simulator_steps_per_second > 0)
              ' <<< "$result" >/dev/null
              printf '%s\n' "$result"
              jq -S 'del(.mode, .startup_seconds, .rollout_seconds, .simulator_steps_per_second)' \
                <<< "$result" > "$RUNNER_TEMP/$policy-$mode.json"
            done
            diff "$RUNNER_TEMP/$policy-sync.json" "$RUNNER_TEMP/$policy-async.json"
          done
          jq -e '.mean_return < 50' "$RUNNER_TEMP/random-sync.json" >/dev/null
          jq -e '.time_limit_episodes == 100 and .recorded_steps == 50000' \
            "$RUNNER_TEMP/balance-sync.json" >/dev/null

      - name: Publish the verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:main"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish a public image archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="rl-frozenlake-${GITHUB_SHA:0:12}"
          archive=soma-rl-frozenlake-linux-amd64.tar.gz
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            docker tag "$IMAGE:$GITHUB_SHA" soma-rl-frozenlake:release
            docker save soma-rl-frozenlake:release | gzip -n > "$archive"
            sha256sum "$archive" > "$archive.sha256"
            gh release create "$tag" "$archive" "$archive.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --prerelease \
              --title "FrozenLake workload ${GITHUB_SHA:0:12}" \
              --notes "Verified Linux x86_64 FrozenLake workload image built from $GITHUB_SHA."
          fi
          url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          printf '\n[Download the verified workload image](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"

  kvm:
    name: Run the published workload on KVM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read # Pull the exact published image by digest.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the disposable runner
        run: |
          test -c /dev/kvm
          sudo usermod -aG kvm "$(id -un)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo xfsprogs
          work="$RUNNER_TEMP/rl-kvm"
          mkdir -p "$work"
          truncate -s 16G "$RUNNER_TEMP/rl-kvm.xfs"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/rl-kvm.xfs"
          sudo mount -o loop "$RUNNER_TEMP/rl-kvm.xfs" "$work"
          sudo chown "$(id -u):$(id -g)" "$work"
          rustup target add x86_64-unknown-linux-musl
          ./scripts/build-fs-tools.sh "$RUNNER_TEMP/fs-tools"

      - name: Compile the image and verify two real VM runs
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:$GITHUB_SHA")
          export RL_KVM_IMAGE="$IMAGE@$digest"
          export SOMA_MACHINE_HOST_LOG="$RUNNER_TEMP/rl-kvm/machine-host.log"
          df -h "$RUNNER_TEMP" "$RUNNER_TEMP/rl-kvm"
          sg kvm -c 'bash -eu -s' <<'SCRIPT'
          test -r /dev/kvm && test -w /dev/kvm
          ./scripts/end-to-end-check.sh \
            --image "$RL_KVM_IMAGE" \
            --fs-tools "$RUNNER_TEMP/fs-tools" \
            --work "$RUNNER_TEMP/rl-kvm" \
            --expect '"trained_goal_count": 100' \
            --purge \
            --command /usr/local/bin/python3 /opt/soma-rl/train.py --seed 42
          SCRIPT

      - name: Retain run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-kvm-evidence
          path: |
            ${{ runner.temp }}/rl-kvm/results.json
            ${{ runner.temp }}/rl-kvm/cleanup-checks.tsv
            ${{ runner.temp }}/rl-kvm/run-*.json
            ${{ runner.temp }}/rl-kvm/run-*.err
            ${{ runner.temp }}/rl-kvm/machine-host.log
            ${{ runner.temp }}/rl-kvm/logs/*.log
