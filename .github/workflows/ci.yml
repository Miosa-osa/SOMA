name: CI

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/**
      - benchmarks/**
      - scripts/**
      - .github/workflows/ci.yml
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/**
      - benchmarks/**
      - scripts/**
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  linux:
    name: Ubuntu 24.04 x86_64 correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Ensure ShellCheck is available
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends shellcheck
          fi

      - name: Run Linux validation
        run: ./scripts/check.sh linux

      - name: Compile-check Linux ARM64 client
        run: |
          rustup target add aarch64-unknown-linux-gnu --toolchain "$RUST_TOOLCHAIN"
          cargo check --workspace --all-targets --locked --target aarch64-unknown-linux-gnu
