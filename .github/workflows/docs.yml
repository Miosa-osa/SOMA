name: Documentation policy

on:
  pull_request:
    paths:
      - "**/*.md"
      - typos.toml
      - .github/workflows/docs.yml
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - typos.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Documentation structure and claims
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The evidence check resolves every commit a live-proved ledger row names, and a
          # shallow checkout would make a commit that exists look missing.
          fetch-depth: 0

      - name: Check architecture and claim policy
        run: ./scripts/check-architecture.sh

      - name: Check evidence links, ledger commits, and retained samples
        run: python3 ./scripts/check-evidence.py docs
