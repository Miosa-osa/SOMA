name: Release bundle

# A pushed tag builds, verifies, and drafts the GitHub release for exactly that commit.
# A manual run builds and verifies the same artifacts from the chosen branch and publishes
# nothing, which is the dry run of the whole procedure.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to validate without publishing; empty means v followed by VERSION
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-bundle-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  native:
    name: Validate and build the Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The evidence check resolves every commit the claim ledger names.
          fetch-depth: 0

      - name: Resolve the release tag
        id: tag
        run: |
          tag="${RELEASE_TAG_INPUT:-}"
          if [[ -z "$tag" ]]; then
            tag="v$(tr -d '\r\n' < VERSION)"
          fi
          if [[ ! "$tag" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "not a release tag: $tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A pushed tag must name the commit this job checked out.
            [[ "$(git rev-parse "refs/tags/${tag}^{commit}")" == "$(git rev-parse HEAD)" ]]
          fi
          printf 'release_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain and the static guest target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-unknown-linux-musl --toolchain "$RUST_TOOLCHAIN"

      - name: Ensure validation tools are available
        run: |
          if ! command -v jq >/dev/null 2>&1 || ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends jq shellcheck
          fi

      - name: Validate, build, assemble, and verify the Linux release
        env:
          SOMA_RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: ./scripts/check.sh release

      - name: Upload the Linux release parts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soma-${{ steps.tag.outputs.release_tag }}-parts-linux
          path: target/release-parts/${{ steps.tag.outputs.release_tag }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  client-binaries:
    name: Build the ${{ matrix.target }} client bundle
    needs: native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            cli_binary: soma
            mcp_binary: soma-mcp
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            cli_binary: soma.exe
            mcp_binary: soma-mcp.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Build, describe, and verify the native client bundle
        shell: bash
        env:
          SOMA_RELEASE_CLI_BINARY: ${{ matrix.cli_binary }}
          SOMA_RELEASE_MCP_BINARY: ${{ matrix.mcp_binary }}
          SOMA_RELEASE_TAG: ${{ needs.native.outputs.release_tag }}
          SOMA_RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/package-client-release.sh

      - name: Upload the client release part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soma-${{ needs.native.outputs.release_tag }}-parts-${{ matrix.target }}
          path: target/release-parts/${{ needs.native.outputs.release_tag }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  assemble:
    name: Assemble and verify the release
    needs: [native, client-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every release part
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: soma-${{ needs.native.outputs.release_tag }}-parts-*
          path: release-parts
          merge-multiple: true

      - name: Assemble the release, write its manifest, and verify it
        env:
          SOMA_RELEASE_TAG: ${{ needs.native.outputs.release_tag }}
        run: |
          ./scripts/assemble-release.sh "release/${SOMA_RELEASE_TAG}" release-parts/*
          jq . "release/${SOMA_RELEASE_TAG}/soma-${SOMA_RELEASE_TAG}-manifest.json"

      - name: Upload the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soma-${{ needs.native.outputs.release_tag }}
          path: release/${{ needs.native.outputs.release_tag }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    name: Draft the GitHub release
    if: github.event_name == 'push'
    needs: [native, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the draft release and uploads its verified assets
    steps:
      - name: Download the verified release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soma-${{ needs.native.outputs.release_tag }}
          path: release

      - name: Draft the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          SOMA_RELEASE_TAG: ${{ needs.native.outputs.release_tag }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "SOMA ${SOMA_RELEASE_TAG}")
          if [[ "$SOMA_RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$SOMA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" release/*
