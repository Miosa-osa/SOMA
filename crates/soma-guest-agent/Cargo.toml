[package]
name = "soma-guest-agent"
description = "Statically linked Linux PID 1 guest agent that drives SOMA repair, control, and execution"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "soma-guest-agent"
path = "src/main.rs"

[features]
# Renders the repair-step timings on the console once the agent is ready. Off by default: the
# shipped agent records the steps but never spends the console on them.
timing-report = []

[dependencies]
soma-guest = { path = "../soma-guest", version = "=1.0.0-alpha.1" }
zeroize = "=1.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
