[package]
name = "soma-mcp"
description = "Bounded stdio MCP adapter for SOMA sandboxes"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "soma_mcp"
path = "src/lib.rs"

[[bin]]
name = "soma-mcp"
path = "src/main.rs"

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
clap = { version = "=4.6.6", features = ["derive"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["macros", "server", "transport-async-rw"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
soma = { path = "../soma", version = "=1.0.0-alpha.1" }
soma-local = { path = "../soma-local", version = "=1.0.0-alpha.1" }
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
uuid = { version = "=1.26.0", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "macros", "server"] }

[lints]
workspace = true
