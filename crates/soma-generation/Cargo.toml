[package]
name = "soma-generation"
description = "Content-addressed OCI import foundation for SOMA Generation construction"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
soma = { path = "../soma", version = "=1.0.0-alpha.1" }
tar = { version = "=0.4.46", default-features = false }

[dev-dependencies]
soma-template = { path = "../soma-template", version = "=1.0.0-alpha.1" }
tempfile = "=3.27.0"

[lints]
workspace = true
