[package]
name = "soma-api"
description = "HTTP sandbox lifecycle service for SOMA"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "soma_api"
path = "src/lib.rs"

[[bin]]
name = "soma-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
soma = { path = "../soma", version = "=1.0.0-alpha.1" }
soma-local = { path = "../soma-local", version = "=1.0.0-alpha.1" }
uuid = { version = "=1.26.0", features = ["v4"] }
