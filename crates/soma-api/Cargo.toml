[package]
name = "soma-api"
description = "HTTP sandbox lifecycle service for SOMA"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "soma_api"
path = "src/lib.rs"

[[bin]]
name = "soma-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
bytes = "=1.12.1"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "=0.1.21", features = ["http1", "http2", "server", "server-auto", "tokio"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
soma = { path = "../soma", version = "=1.0.0-alpha.1" }
soma-guest = { path = "../soma-guest", version = "=1.0.0-alpha.1" }
soma-local = { path = "../soma-local", version = "=1.0.0-alpha.1" }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "=1.26.0", features = ["v4"] }
