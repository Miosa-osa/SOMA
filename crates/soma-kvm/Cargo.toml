[package]
name = "soma-kvm"
description = "Linux KVM capability probe, x86_64 machine floor, and ARM64 cold-boot proofs for SOMA"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
kvm-bindings = "=0.14.1"

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
kvm-ioctls = "=0.25.0"
libc = "=0.2.189"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dev-dependencies]
kvm-bindings = "=0.14.1"
libc = "=0.2.189"
linux-loader = "=0.14.0"
vm-fdt = "=0.3.0"
vm-memory = { version = "=0.18.0", features = ["backend-mmap"] }
vm-superio = "=0.8.1"
vmm-sys-util = "=0.15.0"
