[package]
name = "soma-storage"
description = "XFS reflink storage profile with sterile ext4 overlay templates, private clone heads, leases, release, and reconciliation"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "soma-storage-bench"
path = "src/bin/soma-storage-bench.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(unix)'.dependencies]
cap-std = "=4.0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
