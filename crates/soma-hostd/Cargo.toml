[package]
name = "soma-hostd"
description = "Node-local host allocator with sterile prepared-worker pools, single-winner claims, exactly-once authority transfer, and capacity admission"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "soma-hostd"
path = "src/bin/soma-hostd.rs"

[dependencies]
# The per-volume data key. Both versions are the ones `snow` already resolves, so no new crate
# enters the lockfile: only a direct edge to the cipher the guest protocol already uses.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
getrandom = "=0.2.17"
sha2 = { version = "=0.11.0", default-features = false }
zeroize = "=1.9.0"
soma-guest = { path = "../soma-guest", version = "=1.0.0-alpha.1" }
soma-netd = { path = "../soma-netd", version = "=1.0.0-alpha.1" }
soma-storage = { path = "../soma-storage", version = "=1.0.0-alpha.1" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
