[package]
name = "soma-vmm"
description = "Provider-neutral lifecycle interface for one SOMA machine"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[[bin]]
name = "soma-vmm"
path = "src/bin/soma-vmm/main.rs"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "=0.2.189"
soma-guest = { path = "../soma-guest", version = "=1.0.0-alpha.1" }
soma-jail = { path = "../soma-jail" }
soma-kvm = { path = "../soma-kvm", version = "=1.0.0-alpha.1" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
serde_json = "=1.0.151"
