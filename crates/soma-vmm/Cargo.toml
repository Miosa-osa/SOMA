[package]
name = "soma-vmm"
description = "Provider-neutral lifecycle interface for one SOMA machine"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[[bin]]
name = "soma-vmm"
path = "src/bin/soma-vmm/main.rs"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "=0.2.190"
soma = { path = "../soma", version = "=1.0.0-alpha.1" }
soma-guest = { path = "../soma-guest", version = "=1.0.0-alpha.1" }
soma-jail = { path = "../soma-jail", version = "=1.0.0-alpha.1" }
soma-kvm = { path = "../soma-kvm", version = "=1.0.0-alpha.1" }
serde_json = "=1.0.151"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
serde_json = "=1.0.151"
# Already in the lockfile for the host daemon and the machine tests; a volume test needs a file
# the launch can open and one it cannot.
tempfile = "=3.27.0"
