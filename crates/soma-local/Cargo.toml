[package]
name = "soma-local"
description = "Durable local state and host adapters for SOMA"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
soma = { path = "../soma", version = "=1.0.0-alpha.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
soma-macos = { path = "../soma-macos", version = "=1.0.0-alpha.1" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
sha2 = { version = "=0.11.0", default-features = false }
soma-generation = { path = "../soma-generation", version = "=1.0.0-alpha.1" }
soma-guest = { path = "../soma-guest", version = "=1.0.0-alpha.1" }
soma-hostd = { path = "../soma-hostd", version = "=1.0.0-alpha.1" }
soma-kvm = { path = "../soma-kvm", version = "=1.0.0-alpha.1" }
soma-netd = { path = "../soma-netd", version = "=1.0.0-alpha.1" }
libc = "=0.2.189"
soma-storage = { path = "../soma-storage", version = "=1.0.0-alpha.1" }
soma-vmm = { path = "../soma-vmm", version = "=1.0.0-alpha.1" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
