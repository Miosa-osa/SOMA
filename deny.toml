[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
# Each entry names who pulls the crate in, why it cannot move, and the evidence that the affected
# code is not compiled into SOMA. Review every entry by 2027-02-01. The same IDs are in
# .cargo/audit.toml for cargo audit.
ignore = [
    { id = "RUSTSEC-2026-0457", reason = "rmcp is held at 3.1.4 by commit 4e55b89: rmcp's CHANGELOG 3.5.0 (add LATEST_WITH_INITIALIZE) and 3.6.0 (reject requests to 2026-07-28 clients) take the MCP 2026-07-28 revision off the initialize handshake, so rmcp 3.9.0 answers a 2026-07-28 initialize with 2025-11-25 (tried: soma-mcp doctor_tool.rs::legacy_and_current_clients_negotiate_their_requested_versions fails) and no server cap keeps today's negotiation; moving soma-mcp to that revision is an owner decision; the advisory is in rmcp's OAuth client (feature auth), which is not built: soma-mcp builds rmcp with default-features = false and only macros, server and transport-async-rw (dev-dependency: client, macros, server), Cargo.lock resolves no oauth2, reqwest, hyper or axum under rmcp, and soma-mcp references no OAuth or Streamable HTTP type. Review by 2027-02-01." },
    { id = "RUSTSEC-2026-0461", reason = "rmcp is held at 3.1.4 by commit 4e55b89: rmcp's CHANGELOG 3.5.0 (add LATEST_WITH_INITIALIZE) and 3.6.0 (reject requests to 2026-07-28 clients) take the MCP 2026-07-28 revision off the initialize handshake, so rmcp 3.9.0 answers a 2026-07-28 initialize with 2025-11-25 (tried: soma-mcp doctor_tool.rs::legacy_and_current_clients_negotiate_their_requested_versions fails) and no server cap keeps today's negotiation; moving soma-mcp to that revision is an owner decision; the advisory is in StreamableHttpService (feature transport-streamable-http-server), which is not built: soma-mcp builds rmcp with default-features = false and only macros, server and transport-async-rw (dev-dependency: client, macros, server), Cargo.lock resolves no oauth2, reqwest, hyper or axum under rmcp, and soma-mcp references no OAuth or Streamable HTTP type. Review by 2027-02-01." },
    { id = "RUSTSEC-2026-0462", reason = "rmcp is held at 3.1.4 by commit 4e55b89: rmcp's CHANGELOG 3.5.0 (add LATEST_WITH_INITIALIZE) and 3.6.0 (reject requests to 2026-07-28 clients) take the MCP 2026-07-28 revision off the initialize handshake, so rmcp 3.9.0 answers a 2026-07-28 initialize with 2025-11-25 (tried: soma-mcp doctor_tool.rs::legacy_and_current_clients_negotiate_their_requested_versions fails) and no server cap keeps today's negotiation; moving soma-mcp to that revision is an owner decision; the advisory is in the Streamable HTTP clients (features transport-streamable-http-client-reqwest and -unix-socket), which are not built: soma-mcp builds rmcp with default-features = false and only macros, server and transport-async-rw (dev-dependency: client, macros, server), Cargo.lock resolves no oauth2, reqwest, hyper or axum under rmcp, and soma-mcp references no OAuth or Streamable HTTP type. Review by 2027-02-01." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no patched release; SOMA does not depend on it directly: it comes only through soma-mcp -> rmcp 3.1.4 and soma-mcp -> schemars 1.2.2 (feature chrono04, enabled by rmcp), and rmcp 3.9.0 still pulls it. An unmaintained notice, not a vulnerability. Review by 2027-02-01." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
    { crate = "bitflags@1.3.2", reason = "vmm-sys-util still requires bitflags 1 while kvm-ioctls uses bitflags 2" },
    { crate = "block-buffer@0.10.4", reason = "snow 0.10 still uses the RustCrypto digest 0.10 line" },
    { crate = "chacha20@0.9.1", reason = "snow 0.10 still uses the RustCrypto 0.9 stream cipher while the QUIC stack's rand 0.10 uses chacha20 0.10" },
    { crate = "cpufeatures@0.2.17", reason = "snow 0.10 still uses the RustCrypto 0.10 cipher line" },
    { crate = "crypto-common@0.1.7", reason = "snow 0.10 still uses the RustCrypto 0.10 cipher and digest lines" },
    { crate = "digest@0.10.7", reason = "snow 0.10 still uses the RustCrypto digest 0.10 line" },
    { crate = "getrandom@0.2.17", reason = "ring 0.17, the runner's TLS and QUIC crypto provider, still uses getrandom 0.2" },
    { crate = "getrandom@0.3.4", reason = "snow 0.10 has not converged on the getrandom 0.4 line used elsewhere" },
    { crate = "io-lifetimes@2.0.4", reason = "cap-primitives 4 uses fs-set-times before its io-lifetimes 3 migration" },
    { crate = "syn@2.0.119", reason = "tracing-attributes still requires syn 2 while the current macro dependency set uses syn 3" },
]
skip-tree = [
    { crate = "windows-sys@0.52.0", depth = 1, reason = "ring 0.17, the runner's TLS and QUIC crypto provider, still uses windows-sys 0.52" },
    { crate = "windows-sys@0.59.0", depth = 3, reason = "cap-primitives 4 dependencies have not converged on windows-sys 0.61" },
    { crate = "windows-sys@0.60.2", depth = 3, reason = "cap-primitives 4 dependencies have not converged on windows-sys 0.61" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
