# Sunshine, the stream a human watches and drives the desktop through. It captures Xorg's screen
# (:0), encodes H.264 in software (no GPU), listens on loopback only, and is reached only through
# moonlight-web in the same guest. The settings are the ones a CPU-only desktop needs.
capture = x11
encoder = software
sw_preset = superfast
sw_tune = zerolatency
min_threads = 2
bind_address = 127.0.0.1
address_family = ipv4
origin_web_ui_allowed = pc
upnp = disabled
hevc_mode = 0
minimum_fps_target = 30
min_log_level = 2
