# The screen of a SOMA desktop: Xorg with the dummy video driver, a 1920x1080 frame buffer in
# memory and no real display or GPU. The agent's pointer and keyboard come through XTEST
# (cua-driver); a human's come through the viewer, whose uinput devices Xorg adds through udev
# (libinput) when the viewer creates them. With no viewer running there is no input device.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 32768
EndSection

Section "Monitor"
    Identifier "dummy"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1920x1080_60.00" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
EndSection

Section "Screen"
    Identifier "dummy"
    Device "dummy"
    Monitor "dummy"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080_60.00"
        Virtual 1920 1080
    EndSubSection
EndSection
