<!doctype html>
<!-- The SOMA desktop viewer's front door: it finds this desktop and opens its stream directly,
     over WebSockets (the transport the SOMA tunnel carries), with no host or app picker. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIOSA Desktop</title>
<link rel="icon" href="miosa-icon.png">
<style>
  html,body{height:100%;margin:0;background:#0b0d12;color:#c8ccd6;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  img{width:220px;opacity:.95}
  .bar{width:180px;height:3px;border-radius:3px;background:#1c1f28;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#8b8bff;border-radius:3px;animation:s 1.1s ease-in-out infinite}
  @keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  #status{font-size:13px;color:#7d8494}
</style>
</head>
<body>
<main>
  <img src="miosa-logo.png" alt="MIOSA">
  <div class="bar"><i></i></div>
  <div id="status">Connecting to your desktop</div>
</main>
<script>
(async () => {
  const status = document.getElementById("status");
  const lines = async (path) => (await (await fetch(path, {cache: "no-store"})).text())
    .split("\n").filter(Boolean).map((line) => JSON.parse(line));
  try {
    // A stored setting is kept, but the transport is always WebSockets: WebRTC cannot cross the tunnel.
    const stored = JSON.parse(localStorage.getItem("mlSettings") || "{}");
    localStorage.setItem("mlSettings", JSON.stringify({...stored, dataTransport: "websocket"}));
    let host;
    for (let i = 0; i < 40 && !host; i++) {
      const listed = (await lines("api/hosts")).flatMap((entry) => entry.hosts || [entry]);
      host = listed.find((entry) => entry.paired === "Paired");
      if (!host) await new Promise((resolve) => setTimeout(resolve, 250));
    }
    if (!host) throw new Error("the desktop is not ready yet");
    const apps = (await lines(`api/apps?host_id=${host.host_id}`)).flatMap((entry) => entry.apps || []);
    const app = apps.find((entry) => entry.title === "Desktop") || apps[0];
    if (!app) throw new Error("the desktop offers nothing to stream");
    const query = new URLSearchParams({hostId: host.host_id, appId: app.app_id, width: 1920, height: 1080, fps: 60});
    location.replace(`stream.html?${query}`);
  } catch (error) {
    status.textContent = `Could not open the desktop: ${error.message}. Retrying...`;
    setTimeout(() => location.reload(), 2000);
  }
})();
</script>
</body>
</html>
