# The compositor: rounded corners and soft shadows, drawn in software (the screen is a frame buffer
# with no GPU). No blur and no fades: both cost CPU on every frame the viewer encodes.
backend = "xrender";
# No rounded corners. With the xrender backend, picom's corner rounding leaks the screen server's
# memory on every repaint: a window that redraws once a second (the System app) grew Xvfb by about
# 500 MB a minute until the desktop was killed for memory (a 4 GB desktop at 55 minutes, a 95 GB
# preview container). Measured on host-12 2026-11-23: shipped config 530 MB/min, without corner
# rounding 0.9 MB/min, without shadows still 248 MB/min. Shadows stay.
vsync = false;
use-damage = true;
shadow = true;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-opacity = 0.32;
shadow-exclude = [ "name = 'miosa-bar'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@:c" ];
fading = false;
inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;
